# Phoenix metropolitan area: downtown, Tempe, Mesa, Scottsdale, Glendale, Goodyear and the desert edge.
city: phoenix
bbox: [-112.75, 33.15, -111.50, 33.80]   # lon_min, lat_min, lon_max, lat_max (WGS84); includes Buckeye and Queen Creek
crs: EPSG:32612                           # UTM 12N, metres, for buffers and maps

period:
  start: "2023-01-01"
  end: "2023-12-31"

stations:
  sources: [noaa-isd, azmet]              # NOAA airport stations + AZMet (turf, farmland, suburbs)
  min_coverage: 0.55                      # some airports report only part of the day (~60% of hours)
  valid_range_c: [-15, 55]                # plausible air temperature range for Phoenix
  max_step_c: 8                           # max change from both neighbouring hours (spike filter)

era5:
  model: era5                             # 0.25 deg (~25 km) reanalysis, the coarse input
  raw_grid_cell: true                     # elevation=nan: no lapse-rate adjustment by the API

features:
  radii_m: [100, 500]                     # land-cover and NDVI context around each station
  ndvi_period: ["2023-05-01", "2023-09-30"]
  ndvi_max_cloud: 10
  ndvi_scenes: 5                          # median NDVI over up to 5 clear Landsat scenes

# Milestone 2: ERA5 correction, evaluated leave-one-station-out
model:
  ridge_alpha: 10
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 2000     # large leaves: only ~14 distinct sites per fold, avoid memorising them
    feature_fraction: 0.8
    bagging_fraction: 0.8
    seed: 0

paths:
  stations: data/phoenix/stations.csv
  observations: data/phoenix/observations.parquet
  era5: data/phoenix/era5.parquet
  features: data/phoenix/site_features.csv
  dataset: data/phoenix/dataset.parquet
  station_summary: outputs/station_summary.csv
  station_map: outputs/figures/phoenix_stations.png
  oof: data/phoenix/predictions_loso.parquet
  model_lightgbm: data/phoenix/models/lightgbm.txt
  results_dir: outputs
