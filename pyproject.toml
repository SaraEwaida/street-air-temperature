[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "street-air-temperature"
version = "0.1.0"
description = "Street-level 2 m air temperature in Phoenix from ERA5, land cover, vegetation and elevation, validated on held-out weather stations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "rasterio>=1.3",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pystac>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
agent = ["anthropic>=0.40", "openai>=1.50"]

[project.scripts]
sat = "streetair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
